name: Export and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - uses: actions/checkout@v4
      - name: Set up export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ls /root/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/

      - name: Import project assets
        run: godot --headless --import || true

      - name: Export Web build
        run: |
          mkdir -p build
          godot --headless --verbose --export-release "Web" build/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
